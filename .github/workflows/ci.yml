
name: EventBooking CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore EventBooking.slnx

      - name: Build solution
        run: dotnet build EventBooking.slnx --configuration Release --no-restore

      - name: Run all tests
        run: dotnet test EventBooking.Tests/EventBooking.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EventBooking-TestResults
          path: EventBooking.Tests/TestResults/
          if-no-files-found: ignore
