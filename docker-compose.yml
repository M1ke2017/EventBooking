
services:
  postgres:
    image: postgres:17
    container_name: eventbooking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventbooking
      POSTGRES_USER: eventbooking
      POSTGRES_PASSWORD: eventbooking_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - eventbooking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventbooking -d eventbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eventbooking_data:
